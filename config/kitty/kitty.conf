# font_family      MesloLGS Nerd Font Mono
# bold_font        auto
# italic_font      auto
# bold_italic_font auto
font_size 12.0


# BEGIN_KITTY_FONTS
font_family      family='MesloLGS Nerd Font Mono' postscript_name=MesloLGSNFM-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# ---------------------------------------------------------------------------
# Skylight -- the colour scheme, taken from the wallpaper.
#
# config/wallpapers/LSZEE Skylight Red Rocks.jpg is indigo haze (over a million
# of its pixels sit at hue 240) with a warm tail through magenta into coral and
# a thin cool tail into mint. These are the same values as the Trilium theme
# built from that image, so the terminal and the notes match.
#
# Two deliberate departures from that palette, both forced by ANSI:
#
#   * The wallpaper has essentially no green -- 161 pixels, desaturated, at
#     hue 165. Trilium never needed one; a terminal does, for diffs and ls.
#     color2/color10 are therefore the mint rotated to hue 140 at the palette's
#     own saturation and value, so the green reads as part of the family while
#     sitting 27 degrees off the mint that cyan uses.
#   * The palette names only two dim variants (mint-dim, coral-dim). The dim
#     amber, steel and magenta below are the transform those two encode
#     (saturation +0.077, value -0.175) applied to their bright counterparts.
#
# The colours live here rather than in a zsh script on purpose. ~/.zshrc is the
# same file on both machines, so a shell that painted its own background would
# paint it again on the far side of an ssh -- which is exactly what
# config/zsh/env/ssh-tint.zsh exists to prevent. kitty.conf is read only by the
# terminal in front of you; a remote host never sees it. Keeping it here also
# means the window is already the right colour on its first frame, with no
# flash of stock black while zsh starts.
# ---------------------------------------------------------------------------

# The haze.
background            #161A31
foreground            #D6D1EE
selection_background  #5A4FB8
selection_foreground  #ECE9FB
cursor                #6FDCC6
cursor_text_color     #161A31
url_color             #7FA8D9

# The stage lights. Normal on the left of each pair, bright underneath.
color0   #262244
color8   #3E386B
color1   #C9455C
color9   #FF6B81
color2   #4FB972
color10  #6FDC93
color3   #C39653
color11  #F0C078
color4   #587EAC
color12  #7FA8D9
color5   #A4487F
color13  #D16BA8
color6   #4FB9A4
color14  #6FDCC6
color7   #D6D1EE
color15  #ECE9FB

# Splits and tabs, so nothing falls back to a stock grey.
active_border_color      #6FDCC6
inactive_border_color    #3E386B
bell_border_color        #FF6B81
tab_bar_background       #141028
active_tab_background    #5A4FB8
active_tab_foreground    #ECE9FB
inactive_tab_background  #221D3E
inactive_tab_foreground  #9B93C4
