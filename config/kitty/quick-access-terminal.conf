# The dropdown terminal, under niri. Linked to
# ~/.config/kitty/quick-access-terminal.conf by init/links.zsh and bound to
# Mod+grave in config/niri/config.kdl -- the same key the i3 config uses.
#
# This replaces tdrop. Everything the i3 binding in
# config/i3/conf.d/baseconfig.conf fights with is gone here, because the
# dropdown is a first-class kitty feature (`kitten quick-access-terminal`,
# kitty 0.42+) rather than a script bolted onto a normal window:
#
#   * no -a / WM detection, no manual float rule -- on Wayland the window is a
#     wlr-layer-shell surface, which is a different kind of surface from a
#     toplevel and is never tiled by niri in the first place;
#   * no -m monitor arithmetic, and no `-y 1` workaround for tdrop's
#     `((yoff+=y_begin))` returning 1 on a zero result -- layer-shell surfaces
#     are positioned by the compositor against one output's edge, so there is
#     no geometry to compute and nothing to get wrong twice;
#   * no flock. tdrop stored the window id in a file and took no lock while
#     creating the window, so two fast presses raced into two dropdowns. The
#     kitten uses kitty's single-instance socket (keyed by --instance-group,
#     default "quick-access"): the second invocation does not start a kitty at
#     all, it hands off to the running one, which calls
#     toggle_os_window_visibility. Show and hide are the same command.
#
# First press starts it; every press after that toggles it.

# Drop from the top edge, like tdrop's -y.
edge top

# Height. tdrop used -h 45%; this option does NOT take a percentage -- it takes
# a cell count, or a pixel count with a "px" suffix, or cells with "c". An
# unparseable value is silently treated as 1 line (see dual_distance() in
# kitty/kittens/panel/main.py), so "45%" would give a one-line slot with no
# error. 28 lines at font_size 12 lands around 670px, which is ~42% of the
# laptop panel's 1600 -- close to what the i3 dropdown felt like. Tune in
# lines, not pixels, so it stays the same number of rows on every monitor.
lines 28

# Width is not set: `columns` is ignored for a top/bottom panel, which always
# spans the full width of its output. That is tdrop's `-w -4` (full width less
# the border fudge) without needing the fudge.
columns 80

# Above everything, including fullscreen windows.
layer overlay

# Take keyboard focus when shown -- it is a terminal, not a status display.
focus_policy exclusive

# Slightly see-through, so it reads as an overlay rather than a window that
# appeared. This is kitty's normal background_opacity; the kitten just defaults
# it to 0.85 instead of 1.
background_opacity 0.85

# Stay open when focus moves elsewhere, matching the i3 dropdown: it is a
# scratch terminal you leave a long-running thing in, and it is dismissed with
# the same key that opened it. Set to `yes` for click-away-to-hide.
hide_on_focus_loss no

# Note on multi-monitor: a layer-shell surface belongs to the output it was
# created on, and Wayland offers no way to move one afterwards -- so unlike
# tdrop's -m, this will NOT follow focus to another monitor. It stays where it
# was first opened (and is recreated on the next press if that output goes
# away, e.g. on undock). `output_name` pins it to a specific monitor instead.
