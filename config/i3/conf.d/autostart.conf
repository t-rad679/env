# Startup programs and the workspace assignments that route them -- the part
# shared by every machine. Role-only autostarts live in
# machines/<role>/i3/autostart.conf: the desktop's Steam, Spotify screensaver,
# display power-saving overrides, the grimoire terminal and the `general`
# kitty; the laptop's ws3 chat grid, Chrome workspaces and ws8 Spotify.
#
# Workspaces 1 and 3 are deliberately NOT claimed here. The two roles use them
# for different things (ws1 -- desktop: the `general` kitty; laptop: WeftWorks
# Chrome. ws3 -- desktop: the grimoire terminal; laptop: the chat grid), so
# whoever wants one declares it in their own role file.
#
# What is left here is genuinely machine-independent: the daemons every
# machine needs, and the wallpaper.

# Start XDG autostart .desktop files using dex. See also
# https://wiki.archlinux.org/index.php/XDG_Autostart
exec --no-startup-id dex --autostart --environment i3

# NetworkManager is the most popular way to manage wireless networks on Linux,
# and nm-applet is a desktop environment-independent system tray GUI for it.
exec --no-startup-id nm-applet

# Ulauncher app launcher. --hide-window keeps it from popping up at startup;
# it manages its own global hotkey (default Ctrl+Space) once running.
exec --no-startup-id ulauncher --hide-window

# dunst is the notification daemon; without it nothing owns
# org.freedesktop.Notifications and popups never auto-dismiss.
exec --no-startup-id dunst

# Paint the root window, so a workspace with no windows on it shows the
# wallpaper instead of i3's default black. exec_always, not exec: repainting
# is idempotent, so $mod+Shift+r (restart) also becomes a way to fix an
# unscaled background after a resolution change. ($mod+Shift+c, a plain
# reload, re-runs neither exec nor exec_always -- verified on i3 4.25.)
# Spelled out in full rather than relying on PATH: i3 inherits its environment
# from the X session, which has not sourced the zsh env scripts that put
# ~/src/env/bin on PATH.
exec_always --no-startup-id $HOME/src/env/bin/wallpaper
