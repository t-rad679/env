# The Framework Laptop 16 function row.
#
# The top row's *default* (media legends first, F1-F12 behind Fn) is not set
# here and cannot be: it lives in the keyboard module's own QMK firmware, where
# Fn+Esc toggles it and the choice persists in the module's EEPROM across
# reboots. If the row starts sending F1-F12 again after a keyboard swap, press
# Fn+Esc -- don't reach for xmodmap. A keysym-level swap would have to be
# global, so it would also scramble the F-keys on an external keyboard (the
# Kinesis Freestyle Edge has no Fn layer to compensate with).
#
# What this file does is the other half: give the keycodes somewhere to land.
# The full row, and who owns each key:
#
#   Esc  Fn lock ............. keyboard firmware, not X
#   F1   Mute ................ conf.d/baseconfig.conf (pactl)
#   F2   Volume down ......... conf.d/baseconfig.conf (pactl)
#   F3   Volume up ........... conf.d/baseconfig.conf (pactl)
#   F4   Rewind .............. here
#   F5   Play/pause .......... here
#   F6   Fast forward ........ here
#   F7   Brightness down ..... machines/laptop/i3/laptop.conf (no backlight on the desktop)
#   F8   Brightness up ....... machines/laptop/i3/laptop.conf
#   F9   External display .... machines/laptop/i3/laptop.conf (autorandr is a laptop-only package)
#   F10  Airplane mode ....... nobody -- and deliberately so. The keyboard's
#        Wireless Radio Control HID interface lands on an input device the
#        kernel has already bound to rfkill, so KEY_RFKILL toggles radios
#        without X seeing it. Binding XF86RFKill here would only add a second,
#        competing toggle.
#   F11  Print screen ........ here
#   F12  Framework key ....... left alone, by request
#
# F1-F3 stay in baseconfig.conf rather than moving here: they reference
# $refresh_i3status, which is defined in that file, and config/i3/config
# promises each conf.d file is self-contained so include order doesn't matter.
# Moving them would quietly make that promise false.

# F4 / F5 / F6. playerctl talks MPRIS, so this drives whatever is actually
# playing (Spotify, a browser tab) rather than one hardcoded player.
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext exec --no-startup-id playerctl next

# F11. flameshot's overlay is a normal window, so on a tiling WM it has to be
# told to float or i3 will tile the "screenshot" over half the screen.
bindsym Print exec --no-startup-id flameshot gui
for_window [class="flameshot"] floating enable, border none, fullscreen disable
