# Startup programs and the workspace assignments that route them.
# Self-contained: defines the workspace variables it needs so it doesn't
# depend on include order relative to baseconfig.conf.

set $ws1 "1"
set $ws3 "3"
set $ws4 "4"

# Start XDG autostart .desktop files using dex. See also
# https://wiki.archlinux.org/index.php/XDG_Autostart
exec --no-startup-id dex --autostart --environment i3

# Disable DPMS power-down only (keep screensaver blanking, if any).
# The monitor is a TV over HDMI (see workstation-gpu-display-setup memory);
# DPMS off drops the HDMI link entirely, which kills the TV's own audio
# output along with the picture, stopping any music playing when the
# screen locks/idles. Screensaver blanking alone keeps HDMI live so audio
# survives.
exec --no-startup-id xset -dpms

# NetworkManager is the most popular way to manage wireless networks on Linux,
# and nm-applet is a desktop environment-independent system tray GUI for it.
exec --no-startup-id nm-applet

# Ulauncher app launcher. --hide-window keeps it from popping up at startup;
# it manages its own global hotkey (default Ctrl+Space) once running.
exec --no-startup-id ulauncher --hide-window

# dunst is the notification daemon; without it nothing owns
# org.freedesktop.Notifications and popups never auto-dismiss.
exec --no-startup-id dunst

# Ambient Spotify album-art screensaver (see ~/src/spotify-screensaver-i3).
exec_always --no-startup-id ~/src/spotify-screensaver-i3/bin/spotify-screensaver

# Launch Steam on login. Obsidian runs headless (own Xvfb display + Electron
# profile, started via ~/.xprofile) for Claude's MCP server instead of being
# autostarted here.
exec --no-startup-id steam

# Launch classed kitty instances on login, routed to their workspaces
# by the assign rules below.
exec --no-startup-id kitty --class grimoire
exec --no-startup-id kitty --class general

# Route apps to specific workspaces regardless of which workspace is
# focused when they launch (used by the login autostart execs above).
assign [class="^Steam$"] $ws4
assign [class="grimoire"] $ws3
assign [class="general"] $ws1

# Steam Big Picture launches non-Steam apps (streaming wrappers) inside a
# gamescope window. BPM is the fullscreen window on ws1, so by default i3
# keeps BPM on top and the gamescope window opens behind it -> black screen.
# Force the gamescope window to take over fullscreen + focus when it appears;
# when it closes, BPM (still on ws1) becomes visible again.
for_window [class="gamescope"] fullscreen enable, focus
