# Force the login screen (greeter) to 1080p on HDMI-3.
#
# LightDM has no native "resolution" key, so we run xrandr before the greeter
# starts. display-setup-script runs as root, once, when the X server for the
# greeter comes up. If HDMI-3 is disconnected the xrandr call simply fails and
# the greeter falls back to the default mode.
[Seat:*]
display-setup-script=/usr/bin/xrandr --output HDMI-3 --mode 1920x1080
