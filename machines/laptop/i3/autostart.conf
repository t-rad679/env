# Laptop-only startup programs and window rules. Included from
# config/i3/config via $MACHINE_ROLE; the shared autostarts are in
# config/i3/conf.d/autostart.conf.
#
# Self-contained: defines the workspace variables it needs.

set $ws2 "2"
set $ws3 "3"

# The chat grid: Messenger, Messages, Signal and Discord in a 2x2 on ws3,
# pinned to the dock's ViewSonic. The script appends the saved layout
# (machines/laptop/i3/ws3-chat.json) before launching the apps, then calls
# ws3-output to move the workspace onto the ViewSonic -- see the comments in
# machines/laptop/bin/chat-grid for why it is a script and not config.
#
# `exec`, not `exec_always`: on an i3 reload the apps are already running and
# the placeholders are already spent, so re-running would only duplicate them.
# Spelled out in full rather than relying on PATH, the same as the bindings in
# laptop.conf: i3 inherits its environment from the X session, which has not
# sourced the zsh env scripts that add machines/$MACHINE_ROLE/bin.
exec --no-startup-id $HOME/src/env/machines/laptop/bin/chat-grid

# Route the four chat apps to ws3 no matter which workspace is focused when
# they launch. The saved layout already places them at login; these rules are
# what keeps a later manual relaunch on the right workspace.
#
# Messenger and Messages are Chrome PWAs: their class is the shared
# "Google-chrome" and only the INSTANCE carries the app id, so these must match
# on instance or they would drag ordinary browser windows onto ws3 too.
assign [instance="^crx_bbdeiblfgdokhlblpgeaokenkfknecgl$"] $ws3
assign [instance="^crx_hpfldicfbfomlpcikngkocigghgafkph$"] $ws3

# Signal and Discord report lowercase classes, not the capitalised names in
# their .desktop files.
assign [class="^signal$"] $ws3
assign [class="^discord$"] $ws3

# The Grimoire: a dedicated Obsidian window on the grimoire vault, marked
# "grimoire" and kept on ws4 (pinned to the Samsung in laptop.conf), with a
# kitty in the vault (class/mark "grimoire-term") to its right at the golden
# ratio. It is a script, not an assign, because every Obsidian window has the
# same class -- see machines/laptop/bin/obsidian-grimoire. --no-focus so login
# stays on ws1. Also launchable from Ulauncher as "The Grimoire", which starts
# whichever of the two is missing and focuses the Grimoire.
exec --no-startup-id $HOME/src/env/machines/laptop/bin/obsidian-grimoire --no-focus

# Workspace 1: Spotify on the left and a dedicated Claude Code kitty (class and
# mark "ws1-claude", running bin/claude-env) directly to its right. ws1 is
# pinned to the built-in panel in laptop.conf. A script rather than assigns
# because the Claude window is placed relative to Spotify -- see
# machines/laptop/bin/ws1-spotify-claude. --no-focus leaves login focus alone.
exec --no-startup-id $HOME/src/env/machines/laptop/bin/ws1-spotify-claude --no-focus

# Personal Chrome: a dedicated Chrome window on its own browser profile
# (~/.config/chrome-personal), kept on ws2 (pinned to the Samsung in
# laptop.conf), with a plain kitty (class/mark "personal-chrome-term") to its
# right at the golden ratio. A script rather than bare assigns because the
# terminal is placed relative to Chrome and the profile needs seeding on first
# run -- see machines/laptop/bin/personal-chrome. --no-focus so login stays on
# ws1. Also launchable from Ulauncher as "Personal Chrome", which starts
# whichever of the two is missing and focuses Chrome.
exec --no-startup-id $HOME/src/env/machines/laptop/bin/personal-chrome --no-focus

# Keep both windows on ws2 when they are relaunched by hand. Chrome honours
# --class, so unlike Obsidian it can be matched directly -- but on CLASS only:
# it ignores --name, leaving the instance as "google-chrome (<user-data-dir>)".
# Anchored so this never catches an ordinary "Google-chrome" window.
assign [class="^personal-chrome$"] $ws2
assign [class="^personal-chrome-term$"] $ws2
