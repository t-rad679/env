# Laptop-only startup programs and window rules. Included from
# config/i3/config via $MACHINE_ROLE; the shared autostarts are in
# config/i3/conf.d/autostart.conf.
#
# Self-contained: defines the workspace variables it needs.

set $ws3 "3"

# The chat grid: Messenger, Messages, Signal and Discord in a 2x2 on ws3,
# pinned to the dock's ViewSonic. The script appends the saved layout
# (machines/laptop/i3/ws3-chat.json) before launching the apps, then calls
# ws3-output to move the workspace onto the ViewSonic -- see the comments in
# machines/laptop/bin/chat-grid for why it is a script and not config.
#
# `exec`, not `exec_always`: on an i3 reload the apps are already running and
# the placeholders are already spent, so re-running would only duplicate them.
# Spelled out in full rather than relying on PATH, the same as the bindings in
# laptop.conf: i3 inherits its environment from the X session, which has not
# sourced the zsh env scripts that add machines/$MACHINE_ROLE/bin.
exec --no-startup-id $HOME/src/env/machines/laptop/bin/chat-grid

# Route the four chat apps to ws3 no matter which workspace is focused when
# they launch. The saved layout already places them at login; these rules are
# what keeps a later manual relaunch on the right workspace.
#
# Messenger and Messages are Chrome PWAs: their class is the shared
# "Google-chrome" and only the INSTANCE carries the app id, so these must match
# on instance or they would drag ordinary browser windows onto ws3 too.
assign [instance="^crx_bbdeiblfgdokhlblpgeaokenkfknecgl$"] $ws3
assign [instance="^crx_hpfldicfbfomlpcikngkocigghgafkph$"] $ws3

# Signal and Discord report lowercase classes, not the capitalised names in
# their .desktop files.
assign [class="^signal$"] $ws3
assign [class="^discord$"] $ws3
