# Laptop-only i3 config. Included from config/i3/config via $MACHINE_ROLE.
#
# The rest of the Framework 16 function row (and the map of who owns which key)
# is in config/i3/conf.d/fnrow.conf. What lands here are the three keys that
# only mean something on this machine.

# F7 / F8. Brightness is laptop-only because the desktop has no
# /sys/class/backlight device at all.
#
# These go through machines/laptop/bin/brightness-step rather than calling
# brightnessctl directly, so the backlight can't be walked down to 0 -- see the
# script for why that matters. The absolute path is deliberate: i3 is started
# from the X session, which doesn't necessarily have the PATH that
# config/zsh/env/path.zsh builds, so machines/<role>/bin may not be on it.
bindsym XF86MonBrightnessDown exec --no-startup-id $HOME/src/env/machines/laptop/bin/brightness-step down
bindsym XF86MonBrightnessUp exec --no-startup-id $HOME/src/env/machines/laptop/bin/brightness-step up

# F9, the external-display key. Laptop-only because autorandr is a laptop-only
# package (machines/laptop/packages.txt) -- on the desktop this would just be a
# binding that fails silently.
#
# --change re-detects the outputs and applies whichever saved profile matches
# the current EDIDs, so this is the manual "fix my displays" button for when
# the udev/systemd dock/undock path in machines/laptop/init.zsh doesn't fire.
# --force applies the profile even when autorandr thinks it's already current,
# which is the case worth having a key for.
bindsym XF86Display exec --no-startup-id autorandr --change --force
