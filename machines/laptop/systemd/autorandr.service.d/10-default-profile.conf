# Drop-in for the autorandr.service the autorandr package ships.
#
# The packaged unit runs:
#     autorandr --batch --change --default default
#
# `--default default` names a profile called literally "default", which we do
# not have -- our panel-only profile is "undocked". That only matters when NO
# saved profile's fingerprint matches (an unfamiliar monitor, a projector),
# but that is exactly the case where doing nothing is worst: X leaves the new
# output "connected but disabled", amdgpu fires a hotplug IRQ every few
# seconds, and the i3-bar/window-resize churn comes back.
#
# Point the fallback at "undocked" so an unknown display set degrades to the
# laptop panel alone instead of to a half-configured output.
#
# The empty ExecStart= is required: systemd appends to ExecStart in a drop-in
# unless the list is cleared first, and this unit is Type=oneshot.
[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default undocked
