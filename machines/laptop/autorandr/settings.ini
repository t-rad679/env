# Default options for every autorandr invocation on this machine. The README
# documents this file and the `option-name=option-argument` form; the values
# here are the equivalent of always passing the matching --flag.
[config]

# Match saved profiles by EDID rather than by connector name, renaming the
# outputs inside a profile to whatever the connectors happen to be called on
# this boot.
#
# Required, not a nicety: this laptop's DisplayPort connector numbers are NOT
# stable across reboots. The same two dock monitors were DisplayPort-6=1080p /
# DisplayPort-7=4K on one boot and the exact reverse on the next, with no
# cables touched. Without this, a profile saved under one numbering silently
# fails to match (or worse, matches and puts the monitors in the wrong order)
# after a reboot that renumbers them.
match-edid=1
