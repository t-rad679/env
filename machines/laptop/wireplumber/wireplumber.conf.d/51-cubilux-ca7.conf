# CUBILUX CA7 (Realtek 0bda:4f25)
#
# The ALSA card profile maps "Analog Stereo Output" to PCM device 0, but this
# adapter's physical 3.5mm jack is wired to PCM device 1. Playing through the
# profile therefore streams audio into device 0 and produces silence at the
# jack, while every mixer/PCM/endpoint reading looks perfectly healthy --
# PipeWire, ALSA and the USB endpoint all report success.
#
# Disable ACP for this card so each PCM device is exposed directly, then
# prefer device 1 (the jack) and push device 0 (silent) to the bottom.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Generic_CUBILUX_CA7-00" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Generic_CUBILUX_CA7-00.playback.1.0" }
    ]
    actions = {
      update-props = {
        node.description = "CUBILUX CA7 (desk speakers)"
        priority.session = 2000
        priority.driver  = 2000
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.usb-Generic_CUBILUX_CA7-00.playback.0.0" }
    ]
    actions = {
      update-props = {
        node.description = "CUBILUX CA7 (PCM0 - not wired to the jack)"
        priority.session = 1
        priority.driver  = 1
      }
    }
  }
]
