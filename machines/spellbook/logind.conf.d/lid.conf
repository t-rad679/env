# Lid-switch handling. Linked to /etc/systemd/logind.conf.d/lid.conf by
# machines/spellbook/init.zsh; spellbook-only, since the desktop has no lid.
#
# Closing the lid should lock the session, not suspend it. logind cannot do
# the locking half: HandleLidSwitch=lock only emits the session's
# org.freedesktop.login1.Session `Lock` signal, and neither niri nor Noctalia
# listens for it, so it would lock nothing. So logind is told to keep its
# hands off the lid entirely and the lock is bound as a libinput switch event
# in machines/spellbook/niri/role.kdl instead, where the lock screen that
# answers it actually lives.
#
# All three keys are spelled out rather than just the first. An unset
# HandleLidSwitchExternalPower *inherits* HandleLidSwitch, so leaving it out
# would work today and silently follow along with any future edit to the line
# above it -- the kind of coupling that is invisible until it is wrong.
# HandleLidSwitchDocked is already `ignore` by default and is here to say so
# out loud, because "docked" is this machine's usual state.
#
# Not a symlink target for the whole logind.conf: that file belongs to systemd
# and ships commented-out defaults that are worth keeping readable. A drop-in
# is the supported way in, and `systemd-analyze cat-config systemd/logind.conf`
# shows the merged result.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
