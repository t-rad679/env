# Default options for every autorandr invocation on this machine. The README
# documents this file and the `option-name=option-argument` form; the values
# here are the equivalent of always passing the matching --flag.
[config]

# Match saved profiles by EDID rather than by connector name, renaming the
# outputs inside a profile to whatever the connectors happen to be called on
# this boot.
#
# Required, not a nicety: this spellbook's DisplayPort connector numbers are NOT
# stable across reboots. The same two dock monitors came up as DisplayPort-6
# and DisplayPort-7 on one boot and the exact reverse on the next, with no
# cables touched. That was obvious at the time because one of the two was
# still the old 1080p panel and the other was 4K, so a swap was visible at a
# glance; both are 4K Samsungs now (see machines/spellbook/bin/monitor-output),
# which makes the same renumbering silent rather than absent. Without this, a
# profile saved under one numbering silently fails to match (or worse,
# matches and puts the monitors in the wrong order) after a reboot that
# renumbers them.
match-edid=1
