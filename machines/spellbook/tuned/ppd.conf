# tuned-ppd's PPD-to-TuneD profile mapping. Linked to /etc/tuned/ppd.conf by
# machines/spellbook/init.zsh; spellbook-only, since this is the machine with a
# battery and the only one running tuned.
#
# One line differs from the file tuned-ppd ships: `performance=balanced` in
# [battery]. Without it, choosing Performance anywhere -- the Noctalia bar
# widget, `tuned-adm`, the ACPI platform-profile key -- pins
# throughput-performance and then unplugging the machine changes nothing at
# all. [battery] is an OVERLAY on [profiles], not a separate table
# (tuned/ppd/config.py: `profile_dict_dc = profile_dict_ac |
# dict(cfg[BATTERY_SECTION])`), so a PPD profile with no [battery] entry falls
# straight through to its AC mapping. That is how this machine sat on the
# server throughput profile for six days without anything looking wrong.
#
# The table this produces is the whole point:
#
#     bar choice     on AC                   on battery
#     Power-saver    powersave               powersave
#     Balanced       balanced                balanced-battery
#     Performance    throughput-performance  balanced
#
# A manual override still means something -- Performance on battery keeps more
# headroom than Balanced on battery -- without ever pinning the CPU governor
# and the energy-performance preference to `performance` while running off the
# cell.
#
# `performance=balanced-battery` would read better and is NOT allowed. The
# mapping has to be injective within each of the two maps, because tuned-ppd
# inverts it to answer "which PPD profile is active?"; a repeat raises
# "Duplicate profile mapping" and `balanced` already claims balanced-battery on
# the DC side. Every TuneD profile named here must also exist (`tuned-adm
# list`) or the load fails the same way.
#
# And a failed load is not a warning. PPDConfig raises, tuned-ppd exits, and
# nothing owns net.hadess.PowerProfiles -- which presents as the battery widget
# being broken rather than as a config error. After editing this file run
# `sudo systemctl restart tuned-ppd` and confirm it is still active; do not
# trust the file for having parsed in your head.
#
# One consequence of that injective inversion, for when a readout looks wrong:
# on battery the TuneD profile `balanced` now reports as the PPD profile
# `performance`, since that is the reverse of the last line here. So
# `tuned-adm active` and the bar widget disagree in wording while agreeing
# about what is actually running.

[main]
# Fallback PPD profile when tuned has nothing persisted in
# /etc/tuned/active_profile. A persisted profile wins and survives reboots,
# which is why an override made months ago is still in force today.
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD, on AC
power-saver=powersave
balanced=balanced
performance=throughput-performance

[battery]
# PPD = TuneD, on battery. Overlaid on [profiles] above, so anything omitted
# here keeps its AC mapping -- which is deliberate for power-saver, already the
# most frugal mapping in the file. tuned ships laptop-battery-powersave if that
# ever needs to go further.
balanced=balanced-battery
performance=balanced
