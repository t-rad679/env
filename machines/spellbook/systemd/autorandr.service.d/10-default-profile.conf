# Drop-in for the autorandr.service the autorandr package ships.
#
# The packaged unit runs:
#     autorandr --batch --change --default default
#
# `--default default` names a profile called literally "default", which we do
# not have. That only matters when NO saved profile's fingerprint matches (an
# unfamiliar monitor, a projector, or one of a pair of known monitors failing
# to enumerate), but that is exactly the case where getting it wrong is worst:
# X leaves the new output "connected but disabled", amdgpu fires a hotplug IRQ
# every few seconds, and the i3-bar/window-resize churn comes back.
#
# The fallback used to be "undocked", and that was backwards. "undocked" is a
# saved profile that sets every DisplayPort `off` -- and `off` on a CONNECTED
# monitor IS the "connected but disabled" state described above. So whenever
# one of the two dock monitors failed to enumerate, the fingerprint stopped
# matching, this fallback fired, and it blanked the monitor that was working
# perfectly -- then generated the very IRQ storm it was written to prevent.
# (Measured: 9079 `DMUB HPD IRQ callback` events in one 14-hour session.)
#
# "horizontal" is an autorandr VIRTUAL profile -- "stack all connected outputs
# horizontally at their largest resolution". It always turns connected outputs
# ON, so an unrecognised layout degrades to a usable desktop rather than a
# dark one, and no connector is ever left connected-but-off. It needs no saved
# fingerprint, which is the whole point: it is the case where nothing matched.
#
# The empty ExecStart= is required: systemd appends to ExecStart in a drop-in
# unless the list is cleared first, and this unit is Type=oneshot.
[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default horizontal
