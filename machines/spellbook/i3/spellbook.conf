# Spellbook-only i3 config. Included from config/i3/config via $MACHINE_ROLE.
#
# The rest of the Framework 16 function row (and the map of who owns which key)
# is in config/i3/conf.d/fnrow.conf. What lands here are the three keys that
# only mean something on this machine.

# F7 / F8. Brightness is spellbook-only because the desktop has no
# /sys/class/backlight device at all.
#
# These go through machines/spellbook/bin/brightness-step rather than calling
# brightnessctl directly, so the backlight can't be walked down to 0 -- see the
# script for why that matters. The absolute path is deliberate: i3 is started
# from the X session, which doesn't necessarily have the PATH that
# config/zsh/env/path.zsh builds, so machines/<role>/bin may not be on it.
bindsym XF86MonBrightnessDown exec --no-startup-id $HOME/src/env/machines/spellbook/bin/brightness-step down
bindsym XF86MonBrightnessUp exec --no-startup-id $HOME/src/env/machines/spellbook/bin/brightness-step up

# F9, the external-display key. Spellbook-only because autorandr is a spellbook-only
# package (machines/spellbook/packages.txt) -- on the desktop this would just be a
# binding that fails silently.
#
# --change re-detects the outputs and applies whichever saved profile matches
# the current EDIDs, so this is the manual "fix my displays" button for when
# the udev/systemd dock/undock path in machines/spellbook/init.zsh doesn't fire.
# --force applies the profile even when autorandr thinks it's already current,
# which is the case worth having a key for.
bindsym XF86Display exec --no-startup-id autorandr --change --force

# Pin each workspace to the external monitor it lives on: workspace 1
# (WeftWorks Chrome), 2 (Personal Chrome) and 4 (The Grimoire) to the LEFT
# monitor, workspace 3 (the chat grid) to the RIGHT one -- or, at a desk with
# no right monitor, to the one on TOP (above the built-in panel).
#
# The monitors are named by desk position, not by vendor: at home both
# externals are Samsungs, so a vendor name no longer picks one out, and the
# same position is a different panel at a different desk (the LG at the
# parents' house is "left" just as the LS32A70 is at home).
#
# The connector names can't be written here: the DisplayPort numbers swap
# between boots, and also move when the dock re-enumerates mid-session (see
# machines/spellbook/bin/monitor-output). That script looks each panel up by EDID
# and publishes its connector as these X resources; it runs from xprofile.sh
# before i3 starts and from the autorandr postswitch hook (which reloads i3)
# on every dock/undock. "none" matches no output, so when a monitor is absent
# i3 ignores its rules and the workspaces open wherever they would anyway.
#
# Workspace 3 names two outputs: i3 uses the first one that exists, so with
# `right` resolved to "none" it falls through to `top`. The two positions are
# never occupied at the same time (see the MONITORS table).
#
# Keep these lists in sync with MONITORS in bin/monitor-output.
set_from_resource $left_output i3wm.left_output none
set_from_resource $right_output i3wm.right_output none
set_from_resource $top_output i3wm.top_output none
workspace 1 output $left_output
workspace 2 output $left_output
workspace 4 output $left_output
workspace 3 output $right_output $top_output

# Pin workspace 8 (Spotify, see autostart.conf) to the built-in display.
# Unlike the dock's DisplayPorts, the panel's connector name is stable, and it
# stays on in every autorandr profile, so it can be written directly rather
# than resolved from an X resource the way the externals' are.
workspace 8 output eDP
